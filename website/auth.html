<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>會員登入｜MAUYUAN 貓苑</title><link rel="stylesheet" href="./auth.css"></head>
<body><main class="panel"><p class="brand">MAUYUAN ｜ 貓苑</p><h1>會員登入</h1>
<p class="muted">登入後可進入個人會員頁面。公開網站與預約表單無須登入。</p>
<form id="auth-form">
<label for="email">電子郵件</label><input id="email" type="email" autocomplete="email" required>
<label for="password">密碼（至少 6 個字元）</label><input id="password" type="password" minlength="6" autocomplete="current-password" required>
<div class="actions"><button type="submit" data-mode="login">登入</button><button type="button" id="signup">註冊</button></div>
<button type="button" id="reset" class="link-button">忘記密碼？寄送重設信</button>
</form><p id="status" role="status" aria-live="polite"></p>
<p class="muted"><a href="./index.html">返回公開網站</a></p>
</main><script type="module" src="./auth.js"></script></body></html>

version: "3.9"

# ============================================================
# AI R&D Department — Ultimate Production Stack
# 包含：n8n + Qdrant + PostgreSQL + Redis + Ollama + Open WebUI
# ============================================================

x-n8n-common: &n8n-common
  image: n8nio/n8n:latest
  restart: unless-stopped
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_PORT=5432
    - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
    - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    - N8N_HOST=${N8N_HOST:-localhost}
    - N8N_PORT=5678
    - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
    - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678}
    - N8N_EDITOR_BASE_URL=${WEBHOOK_URL:-http://localhost:5678}
    - EXECUTIONS_MODE=queue
    - QUEUE_BULL_REDIS_HOST=redis
    - QUEUE_BULL_REDIS_PORT=6379
    - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
    - N8N_METRICS=true
    - N8N_LOG_LEVEL=info
    - GENERIC_TIMEZONE=${TIMEZONE:-Asia/Taipei}
    - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    # AI模型設定
    - OPENAI_API_KEY=${OPENAI_API_KEY}
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    # Notion整合
    - NOTION_API_KEY=${NOTION_API_KEY}
  volumes:
    - n8n_data:/home/node/.n8n
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - ai_rnd_network

services:

  # ─────────────────────────────────────────
  # n8n Main (UI + Webhook)
  # ─────────────────────────────────────────
  n8n:
    <<: *n8n-common
    container_name: n8n_main
    ports:
      - "5678:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - n8n_data:/home/node/.n8n
      - ./scripts:/home/node/.n8n/scripts:ro
      - ./backups:/home/node/.n8n/backups
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678}
      - N8N_EDITOR_BASE_URL=${WEBHOOK_URL:-http://localhost:5678}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      - N8N_METRICS=true
      - N8N_LOG_LEVEL=info
      - GENERIC_TIMEZONE=${TIMEZONE:-Asia/Taipei}
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NOTION_API_KEY=${NOTION_API_KEY}

  # ─────────────────────────────────────────
  # n8n Worker (執行引擎，可水平擴展)
  # ─────────────────────────────────────────
  n8n_worker:
    <<: *n8n-common
    container_name: n8n_worker
    command: worker
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'n8n.*worker' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - n8n_data:/home/node/.n8n
      - ./scripts:/home/node/.n8n/scripts:ro
      - ./backups:/home/node/.n8n/backups
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=${N8N_HOST:-localhost}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      - GENERIC_TIMEZONE=${TIMEZONE:-Asia/Taipei}
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NOTION_API_KEY=${NOTION_API_KEY}

  # ─────────────────────────────────────────
  # PostgreSQL — n8n 主資料庫
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres_n8n
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_rnd_network

  # ─────────────────────────────────────────
  # Redis — 任務佇列 + 快取
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis_n8n
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_rnd_network

  # ─────────────────────────────────────────
  # Qdrant — 向量資料庫 (RAG核心)
  # ─────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_vector
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ai_rnd_network

  # ─────────────────────────────────────────
  # Ollama — 本地LLM引擎
  # ─────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_llm
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    # GPU支援 (取消註解以啟用NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    networks:
      - ai_rnd_network

  # ─────────────────────────────────────────
  # Open WebUI — Ollama Web介面
  # ─────────────────────────────────────────
  open_webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open_webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEFAULT_MODELS=llama3.2:3b
      - WEBUI_SECRET_KEY=${OPEN_WEBUI_SECRET:-changeme-secret-key}
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - ollama
    networks:
      - ai_rnd_network

  # ─────────────────────────────────────────
  # Nginx — 反向代理 (生產環境)
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - n8n
    networks:
      - ai_rnd_network
    profiles:
      - production

volumes:
  n8n_data:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
  open_webui_data:
  nginx_logs:

networks:
  ai_rnd_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
